name: WDOS CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile
        run: python -m py_compile app.py tests/test_foundation.py
      - name: Focused tests
        run: python -m unittest discover -s tests -v
