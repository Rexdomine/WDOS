<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>{% block title %}WDOS{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#F8F7F4;color:#171717;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#F8F7F4;">
    <tr><td align="center" style="padding:28px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#FFFFFF;border:1px solid #E8E4E1;">
        <tr><td style="padding:24px 28px;border-bottom:5px solid #D4006A;">
          <img src="{{ logo_url }}" width="180" alt="WODDI" style="display:block;width:180px;max-width:100%;height:auto;border:0;">
          <div style="margin-top:6px;font-size:10px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;color:#6E6A66;">Digital Operating System</div>
        </td></tr>
        <tr><td style="padding:32px 28px 28px;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:18px 28px 24px;border-top:1px solid #E8E4E1;color:#6E6A66;font-size:12px;line-height:1.6;">
          No Woman Is Left Out<br><span style="color:#7CB518;font-weight:700;">WDOS</span> · This is an automated message.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
