name: WDOS CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ui-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          pip install -r requirements.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Verify frozen UI references
        run: python scripts/check_ui_reference_manifest.py
      - name: Isolated Stage 2 browser/state regression
        run: python scripts/stage2_browser_qa.py
      - name: Browser and reference evidence for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-ui-reference-evidence
          path: .hermes/stage2-fidelity-qa/
          if-no-files-found: error
          retention-days: 14
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wdos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wdos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wdos_test
      DB_SSLMODE: disable
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Frozen approved UI reference integrity
        run: python scripts/check_ui_reference_manifest.py
      - name: Canonical Django verification (PostgreSQL)
        run: make verify
      - name: Build and exercise deployment image
        run: |
          docker build -t wdos-stage2-ci .
          docker run -d --name wdos-stage2-smoke --network host \
            -e DATABASE_URL -e DB_SSLMODE -e DJANGO_ALLOWED_HOSTS \
            -e DJANGO_SECRET_KEY=ci-only-strong-placeholder-not-a-real-key-2026 \
            -e PORT=18088 wdos-stage2-ci
          python - <<'PY'
          import json, subprocess, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18088/health', timeout=2) as response:
                      health = json.load(response)
                  assert health['database'] == 'ok' and health['migration_rows'] == 21
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          with urllib.request.urlopen('http://127.0.0.1:18088/auth/login/', timeout=5) as response:
              assert response.status == 200
              assert response.headers['Cache-Control'].startswith('no-store')
          processes = subprocess.check_output(['docker','top','wdos-stage2-smoke','-eo','pid,args'], text=True)
          assert 'run_auth_mailer' in processes and 'gunicorn' in processes
          subprocess.run(['docker','stop','--time','15','wdos-stage2-smoke'], check=True)
          state = json.loads(subprocess.check_output(['docker','inspect','wdos-stage2-smoke'], text=True))[0]['State']
          assert not state['Running'] and state['ExitCode'] == 0, state
          print('Deployment image: PostgreSQL health, auth page, both children, clean termination passed')
          PY
      - name: Container diagnostics on failure
        if: failure()
        run: docker logs wdos-stage2-smoke || true
